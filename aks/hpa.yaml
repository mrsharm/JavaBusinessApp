apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: javaapp-hpa
  namespace: javaapp
  labels:
    app: javaapp
  annotations:
    autoscaling.alpha.kubernetes.io/metrics: '[{"type":"External","external":{"metricName":"azure_monitor_cpu_percentage","metricSelector":{"matchLabels":{"resourceId":"/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.ContainerService/managedClusters/${AKS_CLUSTER}"}},"targetAverageValue":"70"}}]'
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: javaapp
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
