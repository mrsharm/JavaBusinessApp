apiVersion: v1
kind: ServiceAccount
metadata:
  name: javaapp-sa
  namespace: javaapp
  labels:
    app: javaapp
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: "${AZURE_CLIENT_ID}"
    azure.workload.identity/tenant-id: "${AZURE_TENANT_ID}"
automountServiceAccountToken: true
